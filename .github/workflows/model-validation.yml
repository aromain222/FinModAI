name: Model Validation

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/models_data/**'
      - 'backend/tests/**'
      - '.github/workflows/model-validation.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/models_data/**'
      - 'backend/tests/**'
      - '.github/workflows/model-validation.yml'

jobs:
  validate:
    name: Validate Financial Models
    runs-on: ubuntu-latest
    
    env:
      PYTHONPATH: ${{ github.workspace }}
      DATA_MODE: test
      DATA_STALENESS_MAX_MIN: 30
      REQUIRE_MIN_FUND_YEARS: 3

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pytest pytest-asyncio pytest-cov black mypy ruff

    - name: Run code formatting
      run: |
        black backend/models_data backend/tests
        ruff check backend/models_data backend/tests

    - name: Run type checking
      run: |
        mypy backend/models_data backend/tests --ignore-missing-imports

    - name: Run model validation tests
      run: |
        pytest backend/tests/test_lbo_model.py -v --cov=backend/models_data

    - name: Validate sample data
      run: |
        python -c "
        from backend.models_data.lbo_validator import CompanyMetrics, MarketConditions
        from backend.models_data.lbo_model import LBOModelInputs, EnhancedLBOModel

        # Test with sample GOOS data
        company = CompanyMetrics(
            ticker='GOOS',
            revenue_ltm=1428.0e6,
            ebitda_ltm=106.8e6,
            total_debt=374.8e6,
            cash=287.7e6,
            market_cap=1350.0e6,
            current_price=13.54,
            shares_outstanding=104.83e6
        )

        market = MarketConditions(
            risk_free_rate=0.0525,
            market_risk_premium=0.06,
            high_yield_spread=0.05,
            leverage_loan_spread=0.0425,
            typical_leverage=4.5,
            typical_equity_portion=0.45
        )

        inputs = LBOModelInputs(
            company=company,
            market=market,
            purchase_multiple=9.0,
            revenue_growth=0.06,
            ebitda_margin=0.115,
            exit_multiple=8.5
        )

        model = EnhancedLBOModel(inputs)
        results = model.run_model()

        # Validate key metrics
        assert 0.15 <= results['returns']['irr'] <= 0.50, 'IRR out of range'
        assert results['returns']['exit_leverage'] <= 5.0, 'Exit leverage too high'
        "

    - name: Upload coverage report
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: models
        name: models-coverage
