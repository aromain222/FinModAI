name: Real Data Enforcement CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  real-data-enforcement:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run Real Data Enforcement Checks
      run: |
        python ci_real_data_enforcement.py
      env:
        DATA_MODE: production
    
    - name: Check for Blocked Patterns (Shell)
      run: |
        echo "🔍 Running shell-based pattern checks..."
        
        # Define blocked patterns
        BLOCKED_PATTERNS="fixtures|mocks|sampleData|demoData|PLACEHOLDER|placeholder|fake|toy|dummy|test_data|mock_data"
        BLOCKED_STRINGS='"placeholder":\\s*true|"mock":\\s*true|"sample":\\s*true|"demo":\\s*true|"fake":\\s*true|"dummy":\\s*true'
        
        # Search for violations
        echo "Checking for blocked patterns..."
        if grep -R -E "($BLOCKED_PATTERNS)" --include="*.py" --include="*.js" --include="*.ts" --include="*.tsx" --include="*.json" --include="*.html" -n . | grep -v "__pycache__" | grep -v ".git" | grep -v "node_modules"; then
          echo "❌ Blocked patterns detected"
          exit 1
        fi
        
        echo "Checking for blocked string literals..."
        if grep -R -E "($BLOCKED_STRINGS)" --include="*.py" --include="*.js" --include="*.ts" --include="*.tsx" --include="*.json" --include="*.html" -n . | grep -v "__pycache__" | grep -v ".git" | grep -v "node_modules"; then
          echo "❌ Blocked string literals detected"
          exit 1
        fi
        
        echo "✅ Shell-based pattern checks passed"
    
    - name: Validate Environment Configuration
      run: |
        echo "🔧 Validating environment configuration..."
        
        # Check that production mode is enforced
        if [ "${DATA_MODE:-production}" != "production" ]; then
          echo "⚠️  WARNING: Not in production mode (DATA_MODE=${DATA_MODE:-production})"
        fi
        
        # Check for development flags in production
        if [ "${DEBUG:-false}" = "true" ] || [ "${DEVELOPMENT:-false}" = "true" ]; then
          echo "❌ Development flags detected in production mode"
          exit 1
        fi
        
        echo "✅ Environment configuration validated"
    
    - name: Check Provider Configuration
      run: |
        echo "🔑 Checking provider configuration..."
        
        # Check that at least some providers are configured
        PROVIDER_COUNT=0
        if [ -n "${FINNHUB_API_KEY:-}" ]; then PROVIDER_COUNT=$((PROVIDER_COUNT + 1)); fi
        if [ -n "${ALPHAVANTAGE_API_KEY:-}" ]; then PROVIDER_COUNT=$((PROVIDER_COUNT + 1)); fi
        if [ -n "${FMP_API_KEY:-}" ]; then PROVIDER_COUNT=$((PROVIDER_COUNT + 1)); fi
        if [ -n "${FRED_API_KEY:-}" ]; then PROVIDER_COUNT=$((PROVIDER_COUNT + 1)); fi
        if [ -n "${POLYGON_API_KEY:-}" ]; then PROVIDER_COUNT=$((PROVIDER_COUNT + 1)); fi
        
        # EDGAR and Yahoo are always enabled (no keys required)
        PROVIDER_COUNT=$((PROVIDER_COUNT + 2))
        
        if [ $PROVIDER_COUNT -lt 2 ]; then
          echo "❌ Insufficient providers enabled (need at least 2)"
          exit 1
        fi
        
        echo "✅ Provider configuration validated ($PROVIDER_COUNT providers enabled)"
    
    - name: Test Production Enforcement
      run: |
        echo "🧪 Testing production enforcement..."
        
        # Test that production enforcement blocks mock data
        python -c "
        import sys
        sys.path.append('.')
        from runtime_guardrails import runtime_guardrails
        
        # Test with mock data (should fail)
        mock_data = {
            'provenance': {'revenue': {'source': 'sample', 'as_of': '2024-01-01'}},
            'as_of_quotes': '2024-01-01T12:00:00Z',
            'as_of_fundamentals': '2024-01-01T12:00:00Z',
            'stale': False,
            'historicals': {'revenue': [100, 110]}
        }
        
        try:
            import asyncio
            asyncio.run(runtime_guardrails.enforce_real_data_policy(mock_data, '/test'))
            print('❌ Production enforcement not working - mock data passed')
            sys.exit(1)
        except Exception as e:
            if 'blocked_by_policy' in str(e):
                print('✅ Production enforcement working - mock data blocked')
            else:
                print(f'⚠️  Unexpected error: {e}')
                sys.exit(1)
        "
    
    - name: Generate CI Report
      run: |
        echo "📊 Generating CI report..."
        
        echo "## Real Data Enforcement CI Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ **Status**: All real data enforcement checks passed" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Checks Performed:" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Blocked pattern detection" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Blocked string literal detection" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Environment configuration validation" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Provider configuration validation" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Production enforcement testing" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Provider Status:" >> $GITHUB_STEP_SUMMARY
        echo "- EDGAR: ✅ Enabled (no key required)" >> $GITHUB_STEP_SUMMARY
        echo "- Yahoo: ✅ Enabled (no key required)" >> $GITHUB_STEP_SUMMARY
        echo "- Finnhub: $([ -n "${FINNHUB_API_KEY:-}" ] && echo "✅ Enabled" || echo "❌ Disabled")" >> $GITHUB_STEP_SUMMARY
        echo "- Alpha Vantage: $([ -n "${ALPHAVANTAGE_API_KEY:-}" ] && echo "✅ Enabled" || echo "❌ Disabled")" >> $GITHUB_STEP_SUMMARY
        echo "- FMP: $([ -n "${FMP_API_KEY:-}" ] && echo "✅ Enabled" || echo "❌ Disabled")" >> $GITHUB_STEP_SUMMARY
        echo "- FRED: $([ -n "${FRED_API_KEY:-}" ] && echo "✅ Enabled" || echo "❌ Disabled")" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Build approved for production** 🚀" >> $GITHUB_STEP_SUMMARY
