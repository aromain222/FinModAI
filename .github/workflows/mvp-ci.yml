name: MVP CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      
      - name: Run black
        run: |
          cd backend
          black --check .
      
      - name: Run ruff
        run: |
          cd backend
          ruff check .

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      
      - name: Run pytest
        run: |
          cd backend
          pytest tests/ -v --cov=. --cov-report=xml
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./backend/coverage.xml
          flags: backend
          name: backend-coverage

  real-data-enforcement:
    name: Real Data Enforcement
    runs-on: ubuntu-latest
    env:
      ENFORCE_BRANCHES: '^(main|release/.*)$'   # protected branches
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python (for optional validators)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Scan for dummy/mocks (diagnostic)
        id: scan
        run: |
          set -euo pipefail
          echo "Scanning for disallowed strings..."
          
          # Build list of target files (focus on backend only, exclude third-party)
          mapfile -t FILES < <(find backend -name "*.py" -o -name "*.json" | grep -v __pycache__ | grep -v "site-packages" || true)
          echo "Found ${#FILES[@]} candidate files in backend/"

          # Pattern list (more specific to catch real violations)
          PATTERN='(fixtures|mocks|sampleData|demoData|"placeholder"\s*:\s*true)'

          # Grep with context, don't fail here; we'll decide based on branch
          mkdir -p ci-artifacts
          if grep -R -n -E "$PATTERN" "${FILES[@]}" > ci-artifacts/dummy_hits.txt 2>/dev/null; then
            echo "HITS_FOUND=true" >> "$GITHUB_OUTPUT"
            echo "::warning:: Disallowed strings detected. See dummy_hits.txt artifact."
            echo "------------ Offending lines (first 200) ------------"
            head -n 200 ci-artifacts/dummy_hits.txt
          else
            echo "HITS_FOUND=false" >> "$GITHUB_OUTPUT"
            echo "No disallowed strings found."
          fi

      - name: Upload scan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-data-enforcement-scan
          path: ci-artifacts/

      - name: Fail on protected branches only
        if: steps.scan.outputs.HITS_FOUND == 'true'
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          if [[ "$BRANCH" =~ ${ENFORCE_BRANCHES} ]]; then
            echo "::error:: real-data-enforcement failed on protected branch '${BRANCH}'."
            echo "       Fix the lines listed in dummy_hits.txt or move test-only data behind DATA_MODE=test."
            exit 1
          else
            echo "::warning:: Hits found on non-protected branch '${BRANCH}', not failing the build."
          fi

      # Optional: run staleness/coverage validators as separate diagnostics, never silent-fail
      - name: Optional validators (staleness & coverage)
        if: always()
        run: |
          python - << 'PY'
          import os, json, sys, glob, re
          print("Reminder: run backend staleness/coverage checks here (non-blocking).")
          print("Checking if backend endpoints return proper provenance and timestamps...")
          
          # Check if we can import the backend modules
          try:
              sys.path.append('backend')
              from config import settings
              print(f"✅ Backend config loaded: DATA_MODE={settings.DATA_MODE}")
              
              # Check if production mode is enforced
              if settings.DATA_MODE == "production":
                  print("✅ Production mode is active - dummy data should be blocked")
              else:
                  print(f"⚠️  DATA_MODE is {settings.DATA_MODE} - may allow test data")
                  
          except Exception as e:
              print(f"⚠️  Could not load backend config: {e}")
          
          print("✅ Optional validators completed (non-blocking)")
          PY

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      
      - name: Set up database
        run: |
          cd backend
          python -c "from persistence.database import init_db; init_db()"
      
      - name: Run smoke test
        run: |
          cd backend
          python -c "
          from models_data.generate import generate_dcf_model
          from models_data.bundles import DCFFields, HistoricalFinancial, MarketData, CapitalStructure, Provenance
          from decimal import Decimal
          from datetime import datetime
          
          # Create test bundle
          historicals = [
              HistoricalFinancial(year=2022, revenue=Decimal('100000'), ebitda=Decimal('30000'), free_cash_flow=Decimal('20000')),
              HistoricalFinancial(year=2023, revenue=Decimal('110000'), ebitda=Decimal('33000'), free_cash_flow=Decimal('22000')),
              HistoricalFinancial(year=2024, revenue=Decimal('121000'), ebitda=Decimal('36300'), free_cash_flow=Decimal('24200'))
          ]
          
          market = MarketData(
              price=Decimal('100'),
              market_cap=Decimal('1000000'),
              shares_outstanding=Decimal('10000')
          )
          
          capital = CapitalStructure(
              cash=Decimal('50000'),
              gross_debt=Decimal('20000'),
              net_debt=Decimal('15000')
          )
          
          provenance = {
              'revenue': Provenance(provider='edgar', timestamp=datetime.now()),
              'price': Provenance(provider='yahoo', timestamp=datetime.now())
          }
          
          bundle = DCFFields(
              historicals=historicals,
              market=market,
              capital=capital,
              current_revenue=Decimal('121000'),
              current_ebit=Decimal('30000'),
              current_ebitda=Decimal('36300'),
              current_fcf=Decimal('24200'),
              provenance=provenance,
              as_of_quotes=datetime.now(),
              as_of_fundamentals=datetime.now(),
              stale=False
          )
          
          # Generate model
          results = generate_dcf_model(bundle)
          
          # Validate results
          assert 'enterprise_value' in results
          assert 'equity_value' in results
          assert 'implied_price' in results
          assert results['enterprise_value'] > 0
          assert results['equity_value'] > 0
          
          print('✅ Smoke test passed')
          "

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [lint, test, real-data-enforcement, smoke-test]
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      
      - name: Build
        run: |
          echo "✅ Build successful"

