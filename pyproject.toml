[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
  \.git
| \.venv
| venv
| build
| dist
| __pycache__
| \.pytest_cache
| \.mypy_cache
| \.ruff_cache
| node_modules
| \.cache
)/
'''

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]