# fly.toml app configuration file generated for finmodai-z9qvtg on 2025-10-24T22:37:08-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'finmodai-z9qvtg'
primary_region = 'iad'

[build]
  dockerfile = 'backend/Dockerfile'

[env]
  PYTHONUNBUFFERED = '1'
  WEB_CONCURRENCY = '2'
  PORT = '8080'

[[services]]
  internal_port = 8080
  protocol = 'tcp'

  [[services.ports]]
    port = 80
    handlers = ['http']

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [services.concurrency]
    type = 'connections'
    soft_limit = 150
    hard_limit = 200

  [services.http_checks]
    interval = '10s'
    timeout = '2s'
    grace_period = '30s'
    method = 'GET'
    path = '/healthz'
    protocol = 'http'

[[vm]]
  memory = '1024mb'
  cpu_kind = 'shared'
  cpus = 1
