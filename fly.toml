# Fly.io Configuration for FinModAI Backend

app = "finmodai-backend"
primary_region = "iad"  # Changed from SJC to avoid IPv6 issues

[build]
  dockerfile = "backend/Dockerfile"

[env]
  DATABASE_URL = "sqlite:///./finmodai.db"
  DATA_MODE = "production"
  DEBUG = "False"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

# Disable IPv6 to avoid SJC region issues
[experimental]
  auto_rollback = true
