app = "finmodai-analyzer"
primary_region = "iad"

[experimental]
  auto_rollback = true

[build]
  dockerfile = "backend/Dockerfile"

[env]
  DEBUG = "False"
  PORT = "8080"
  PYTHONUNBUFFERED = "1"
  WEB_CONCURRENCY = "1"
  PYTHONOPTIMIZE = "1"

[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = true

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    soft_limit = 150
    hard_limit = 200

  [[services.http_checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "30s"
    method = "GET"
    path = "/healthz"
    protocol = "http"

[[vm]]
  memory = "4096mb"
  cpu_kind = "shared"
  cpus = 1
