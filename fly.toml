# fly.toml - Optimized for performance and reliability
app = 'finmodai-z9qvtg'
primary_region = 'iad'

[build]
  dockerfile = 'backend/Dockerfile'

[env]
  PYTHONUNBUFFERED = '1'
  WEB_CONCURRENCY = '2'
  PORT = '8080'
  PYTHONOPTIMIZE = '2'  # Enable Python optimizations
  PYTHONHASHSEED = '0'  # Deterministic hashing

[[services]]
  internal_port = 8080
  protocol = 'tcp'
  auto_stop_machines = false  # Prevent cold starts
  auto_start_machines = true
  min_machines_running = 1  # Keep at least one machine warm

  [[services.ports]]
    port = 80
    handlers = ['http']
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [services.concurrency]
    type = 'connections'
    soft_limit = 150
    hard_limit = 200

  # Optimized health checks
  [services.http_checks]
    interval = '10s'
    timeout = '2s'
    grace_period = '30s'
    method = 'GET'
    path = '/healthz'
    protocol = 'http'
    tls_skip_verify = true  # Skip TLS verify for internal health checks

[[vm]]
  memory = '1024mb'
  cpu_kind = 'shared'
  cpus = 1

[metrics]
  port = 9091
  path = '/metrics'