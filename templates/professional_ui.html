<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinModAI Professional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/react-router-dom@5.3.4/umd/react-router-dom.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .skeleton { background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); background-size: 200% 100%; animation: loading 1.5s infinite; }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .sticky-column { position: sticky; top: 24px; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        {% raw %}
        // Debug: Check if libraries loaded
        console.log('React:', typeof React);
        console.log('ReactDOM:', typeof ReactDOM);
        console.log('ReactRouterDOM:', typeof window.ReactRouterDOM);
        
        if (!React || !ReactDOM || !window.ReactRouterDOM) {
            document.getElementById('root').innerHTML = '<div style="color: white; padding: 20px; text-align: center;"><h1>Loading error...</h1><p>React: ' + (typeof React) + '</p><p>ReactDOM: ' + (typeof ReactDOM) + '</p><p>ReactRouterDOM: ' + (typeof window.ReactRouterDOM) + '</p></div>';
            throw new Error('Required libraries not loaded');
        }
        
        const { useState, useEffect, useCallback } = React;
        // React Router 5 - simple destructuring works
        const { HashRouter, Switch: Routes, Route, useHistory, useLocation, NavLink } = window.ReactRouterDOM;
        
        // Create useNavigate hook for React Router 5 compatibility (it uses useHistory)
        const useNavigate = () => {
            const history = useHistory();
            return (path) => history.push(path);
        };

        // Feature flags
        const FEATURE_SHOW_ASSUMPTIONS = false;

        // API Configuration
        const API_BASE = window.location.origin;

        // State Machine
        const STATE = { IDLE: 'idle', LOADING: 'loading', READY: 'ready', ERROR: 'error' };

        // Utility Functions
        const formatCurrency = (value) => {
            if (value === null || value === undefined) return 'N/A';
            if (value >= 1e9) return `$${(value / 1e9).toFixed(1)}B`;
            if (value >= 1e6) return `$${(value / 1e6).toFixed(1)}M`;
            return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2 }).format(value);
        };

        const formatPercent = (value) => {
            if (value === null || value === undefined) return 'N/A';
            return `${(value * 100).toFixed(1)}%`;
        };

        const formatMultiple = (value) => {
            if (value === null || value === undefined) return 'N/A';
            return `${value.toFixed(1)}x`;
        };

        const validateTicker = (ticker) => /^[A-Z][A-Z0-9.\-]{0,14}$/.test(ticker);
        const clampPercent = (value) => Math.max(0, Math.min(100, value));

        // TypeScript Types for Market Overview Charts
        const GICS_SECTORS = [
            'Communication Services', 'Consumer Discretionary', 'Consumer Staples', 
            'Energy', 'Financials', 'Health Care', 'Industrials', 
            'Information Technology', 'Materials', 'Real Estate', 'Utilities'
        ];

        // Chart Data Types
        const SectorPerfPoint = { sector: String, change1dPct: Number };
        const SectorWeight = { sector: String, weight: Number };
        const CompanyLite = {
            ticker: String,
            name: String,
            price: Number,
            change1dPct: Number,
            market_cap: Number,
            ev_to_ebitda: Number,
            pe: Number,
            sparkline: Array
        };

        // LocalStorage helpers
        const getStoredState = (model) => {
            try {
                const stored = localStorage.getItem(`finmodai:${model}:state`);
                return stored ? JSON.parse(stored) : null;
            } catch { return null; }
        };

        const setStoredState = (model, state) => {
            try {
                localStorage.setItem(`finmodai:${model}:state`, JSON.stringify(state));
            } catch {}
        };

        // Skeleton Components
        const SkeletonBox = ({ className = "h-4 w-full" }) => (
            <div className={`skeleton rounded ${className}`}></div>
        );

        const SkeletonCard = () => (
            <div className="bg-white rounded-lg p-4 space-y-3">
                <SkeletonBox className="h-4 w-24" />
                <SkeletonBox className="h-8 w-full" />
            </div>
        );

        const SkeletonTable = ({ rows = 5 }) => (
            <div className="space-y-2">
                {Array.from({ length: rows }).map((_, i) => (
                    <div key={i} className="flex space-x-2">
                        <SkeletonBox className="h-4 w-1/4" />
                        <SkeletonBox className="h-4 w-1/4" />
                        <SkeletonBox className="h-4 w-1/4" />
                        <SkeletonBox className="h-4 w-1/4" />
                    </div>
                ))}
            </div>
        );

        // Top Navigation Component
        const TopNav = () => (
            <nav className="bg-white border-b border-gray-200 sticky top-0 z-50" data-testid="model-nav">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                    <div className="flex items-center justify-between h-16">
                        <div className="flex items-center space-x-8">
                            <h1 className="text-xl font-bold text-gray-900">FinModAI</h1>
                            <div className="flex space-x-1">
                                <NavLink to="/dcf" className={({ isActive }) => `px-4 py-2 rounded-md text-sm font-medium transition-colors ${isActive ? 'bg-blue-100 text-blue-700' : 'text-gray-600 hover:text-gray-900 hover:bg-gray-100'}`} data-testid="active-model-tab" aria-current="page">
                                    DCF
                                </NavLink>
                                <NavLink to="/lbo" className={({ isActive }) => `px-4 py-2 rounded-md text-sm font-medium transition-colors ${isActive ? 'bg-teal-100 text-teal-700' : 'text-gray-600 hover:text-gray-900 hover:bg-gray-100'}`}>
                                    LBO
                                </NavLink>
                                <NavLink to="/comps" className={({ isActive }) => `px-4 py-2 rounded-md text-sm font-medium transition-colors ${isActive ? 'bg-indigo-100 text-indigo-700' : 'text-gray-600 hover:text-gray-900 hover:bg-gray-100'}`}>
                                    Comps
                                </NavLink>
                                <NavLink to="/merger" className={({ isActive }) => `px-4 py-2 rounded-md text-sm font-medium transition-colors ${isActive ? 'bg-orange-100 text-orange-700' : 'text-gray-600 hover:text-gray-900 hover:bg-gray-100'}`}>
                                    Merger
                                </NavLink>
                            </div>
                            </div>
                        <div className="text-sm text-gray-500">Professional Models</div>
                        </div>
                    </div>
            </nav>
        );

        // Persistent Header Component with Home Navigation
        const PersistentHeader = ({ currentPage, ticker }) => {
            const navigate = useNavigate();
            const location = useLocation();
            
            const handleHomeClick = () => {
                navigate('/');
            };
            
            const handleKeyDown = (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    handleHomeClick();
                }
            };
            
            // Generate breadcrumb based on current route
            const getBreadcrumb = () => {
                const path = location.pathname;
                if (path === '/') return 'Home';
                if (path === '/dcf') return ticker ? `Home > DCF Model > ${ticker}` : 'Home > DCF Model';
                if (path === '/lbo') return ticker ? `Home > LBO Model > ${ticker}` : 'Home > LBO Model';
                if (path === '/comps') return ticker ? `Home > Comps Model > ${ticker}` : 'Home > Comps Model';
                if (path === '/merger') return ticker ? `Home > Merger Model > ${ticker}` : 'Home > Merger Model';
                return 'Home';
            };
            
            return (
                <header className="bg-[#12161C] border-b border-[#1C2430] sticky top-0 z-50">
                    <div className="max-w-[1400px] mx-auto px-4 md:px-6 lg:px-8 py-3">
                        <div className="flex items-center justify-between">
                            {/* Left side - Home navigation */}
                            <div className="flex items-center space-x-3">
                                <button
                                    onClick={handleHomeClick}
                                    onKeyDown={handleKeyDown}
                                    tabIndex={0}
                                    className="flex items-center space-x-2 px-3 py-2 rounded-lg transition-all duration-200 hover:bg-[#1C2430] focus:outline-none focus:ring-2 focus:ring-sky-400/50 group"
                                    aria-label="Back to Main Screen"
                                >
                                    {/* Home Icon */}
                                    <svg 
                                        className="w-5 h-5 text-[#9FB0C3] group-hover:text-[#E6EDF3] transition-colors" 
                                        fill="none" 
                                        stroke="currentColor" 
                                        viewBox="0 0 24 24"
                                        aria-hidden="true"
                                    >
                                        <path 
                                            strokeLinecap="round" 
                                            strokeLinejoin="round" 
                                            strokeWidth={2} 
                                            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" 
                                        />
                                    </svg>
                                    {/* Text - hidden on mobile */}
                                    <span className="hidden md:block text-[#9FB0C3] group-hover:text-[#E6EDF3] font-medium transition-colors">
                                        Back to Main Screen
                                    </span>
                                </button>
                                    </div>
                            
                            {/* Center - Breadcrumb */}
                            <div className="hidden sm:block">
                                <nav className="text-sm text-[#9FB0C3]" aria-label="Breadcrumb">
                                    <span>{getBreadcrumb()}</span>
                                </nav>
                    </div>

                            {/* Right side - FinModAI branding */}
                            <div className="flex items-center space-x-2">
                                <div className="w-8 h-8 bg-gradient-to-br from-sky-400 to-blue-600 rounded-lg flex items-center justify-center">
                                    <span className="text-white font-bold text-sm">F</span>
                        </div>
                                <span className="text-[#E6EDF3] font-semibold hidden sm:block">FinModAI</span>
                            </div>
                        </div>
                    </div>
                </header>
        );
        };

        // Sector Performance Bar Chart Component
        const SectorPerformanceChart = ({ sectorPerf, range, isLoading }) => {
            const maxValue = Math.max(...sectorPerf.map(p => Math.abs(p.change1dPct)));
            const maxBarWidth = 200; // pixels
            
            if (isLoading) {
                return (
                    <div className="bg-[#12161C] rounded-2xl p-6 border border-[#1C2430]" data-testid="sector-bar-chart">
                        <div className="animate-pulse">
                            <div className="h-6 bg-[#1C2430] rounded mb-4"></div>
                            <div className="space-y-3">
                                {[...Array(11)].map((_, i) => (
                                    <div key={i} className="flex items-center space-x-4">
                                        <div className="w-32 h-4 bg-[#1C2430] rounded"></div>
                                        <div className="flex-1 h-4 bg-[#1C2430] rounded"></div>
                                        <div className="w-12 h-4 bg-[#1C2430] rounded"></div>
                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            }
            
            return (
                <div className="bg-[#12161C] rounded-2xl p-6 border border-[#1C2430]" data-testid="sector-bar-chart">
                    <div className="flex items-center justify-between mb-6">
                        <h3 className="text-[#E6EDF3] font-semibold text-lg">Sector Performance</h3>
                        <span className="text-[#9FB0C3] text-sm">{range} Change</span>
                    </div>
                    
                    <div className="space-y-3">
                        {sectorPerf.map((point, index) => {
                            const isPositive = point.change1dPct >= 0;
                            const barWidth = maxValue > 0 ? (Math.abs(point.change1dPct) / maxValue) * maxBarWidth : 0;
                            const color = isPositive ? '#10B981' : '#EF4444';
                            
                            return (
                                <div key={point.sector} className="flex items-center space-x-4">
                                    <div className="w-32 text-[#9FB0C3] text-sm truncate">
                                        {point.sector}
                                    </div>
                                    <div className="flex-1 relative">
                                        <div className="h-6 bg-[#1C2430] rounded-full overflow-hidden">
                                            <div 
                                                className={`h-full rounded-full transition-all duration-500 ${isPositive ? 'bg-green-500' : 'bg-red-500'}`}
                                                style={{
                                                    width: barWidth + 'px',
                                                    backgroundColor: color,
                                                    transform: isPositive ? 'none' : 'scaleX(-1)'
                                                }}
                                            />
                                    </div>
                                </div>
                                    <div className={`w-16 text-right text-sm font-medium ${isPositive ? 'text-green-400' : 'text-red-400'}`}>
                                        {point.change1dPct > 0 ? '+' : ''}{point.change1dPct.toFixed(2)}%
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        // Market Cap Share Donut Chart Component
        const MarketCapDonutChart = ({ sectorWeights, isLoading }) => {
            if (isLoading) {
                return (
                    <div className="bg-[#12161C] rounded-2xl p-6 border border-[#1C2430]" data-testid="sector-donut">
                        <div className="animate-pulse">
                            <div className="h-6 bg-[#1C2430] rounded mb-4"></div>
                            <div className="w-48 h-48 mx-auto bg-[#1C2430] rounded-full"></div>
                            <div className="mt-4 space-y-2">
                                {[...Array(5)].map((_, i) => (
                                    <div key={i} className="flex items-center space-x-2">
                                        <div className="w-3 h-3 bg-[#1C2430] rounded"></div>
                                        <div className="flex-1 h-3 bg-[#1C2430] rounded"></div>
                            </div>
                        ))}
                    </div>
                        </div>
                    </div>
                );
            }
            
            // Generate colors for sectors
            const colors = [
                '#3B82F6', '#10B981', '#F59E0B', '#EF4444', '#8B5CF6',
                '#06B6D4', '#84CC16', '#F97316', '#EC4899', '#6366F1', '#14B8A6'
            ];
            
            let cumulativeAngle = 0;
            const segments = sectorWeights.map((weight, index) => {
                const angle = weight.weight * 360;
                const startAngle = cumulativeAngle;
                cumulativeAngle += angle;
                
                return {
                    ...weight,
                    startAngle,
                    endAngle: cumulativeAngle,
                    color: colors[index % colors.length]
                };
            });
            
            return (
                <div className="bg-[#12161C] rounded-2xl p-6 border border-[#1C2430]" data-testid="sector-donut">
                    <h3 className="text-[#E6EDF3] font-semibold text-lg mb-6">Market Cap Share</h3>
                    
                    <div className="flex flex-col items-center">
                        <div className="relative w-48 h-48 mb-6">
                            <svg width="192" height="192" viewBox="0 0 192 192" className="transform -rotate-90">
                                <circle
                                    cx="96" cy="96" r="80"
                                    fill="none"
                                    stroke="#1C2430"
                                    strokeWidth="32"
                                />
                                {segments.map((segment, index) => {
                                    if (segment.weight === 0) return null;
                                    
                                    const startAngle = segment.startAngle;
                                    const endAngle = segment.endAngle;
                                    const largeArcFlag = endAngle - startAngle > 180 ? 1 : 0;
                                    
                                    const x1 = 96 + 80 * Math.cos((startAngle * Math.PI) / 180);
                                    const y1 = 96 + 80 * Math.sin((startAngle * Math.PI) / 180);
                                    const x2 = 96 + 80 * Math.cos((endAngle * Math.PI) / 180);
                                    const y2 = 96 + 80 * Math.sin((endAngle * Math.PI) / 180);
                                    
                                    const pathData = [
                                        `M ${96} ${96}`,
                                        `L ${x1} ${y1}`,
                                        `A 80 80 0 ${largeArcFlag} 1 ${x2} ${y2}`,
                                        'Z'
                                    ].join(' ');
                                    
                                    return (
                                        <path
                                            key={segment.sector}
                                            d={pathData}
                                            fill={segment.color}
                                            className="transition-all duration-500 hover:opacity-80"
                                        />
                                    );
                                })}
                            </svg>
                            <div className="absolute inset-0 flex items-center justify-center">
                    <div className="text-center">
                                    <div className="text-[#E6EDF3] font-bold text-lg">
                                        {sectorWeights.reduce((sum, w) => sum + w.weight, 0).toFixed(1)}%
                        </div>
                                    <div className="text-[#9FB0C3] text-sm">Total</div>
                    </div>
                            </div>
                        </div>
                        
                        <div className="space-y-2 w-full max-h-48 overflow-y-auto">
                            {segments.slice(0, 8).map((segment, index) => (
                                <div key={segment.sector} className="flex items-center space-x-2 text-sm">
                                    <div 
                                        className="w-3 h-3 rounded-full flex-shrink-0"
                                        style={{ backgroundColor: segment.color }}
                                    />
                                    <span className="text-[#9FB0C3] truncate flex-1">{segment.sector}</span>
                                    <span className="text-[#E6EDF3] font-medium">{(segment.weight * 100).toFixed(1)}%</span>
                                </div>
                            ))}
                            {segments.length > 8 && (
                                <div className="text-[#6B7280] text-xs text-center">
                                    +{segments.length - 8} more sectors
                                </div>
                            )}
                        </div>
                    </div>
            </div>
        );
        };

        // Range Toggle Component
        const RangeToggle = ({ range, onRangeChange, isLoading }) => {
            const ranges = ['1D', '1W', '1M'];
            
            return (
                <div className="flex items-center space-x-1 bg-[#1C2430] rounded-lg p-1">
                    {ranges.map((r) => (
                    <button
                            key={r}
                            onClick={() => onRangeChange(r)}
                            disabled={isLoading}
                            className={`px-3 py-1 rounded-md text-sm font-medium transition-all duration-200 ${
                                range === r
                                    ? 'bg-sky-600 text-white'
                                    : 'text-[#9FB0C3] hover:text-[#E6EDF3] hover:bg-[#2C3540]'
                            } ${isLoading ? 'opacity-50 cursor-not-allowed' : ''}`}
                        >
                            {r}
                    </button>
                ))}
            </div>
        );
        };

        // Model Type Card Component
        const ModelTypeCard = ({ title, description, icon, color, modelType, navigate }) => {
            const handleClick = () => {
                navigate(`/${modelType}`);
            };

            return (
                <div 
                    onClick={handleClick}
                    className="bg-[#12161C] rounded-2xl p-6 border border-[#1C2430] hover:border-sky-500/50 cursor-pointer transition-all duration-200 hover:shadow-lg hover:shadow-sky-500/10 group"
                >
                    <div className="flex items-center space-x-4 mb-4">
                        <div className={`w-12 h-12 bg-gradient-to-r ${color} rounded-xl flex items-center justify-center text-2xl group-hover:scale-110 transition-transform`}>
                            {icon}
                        </div>
                        <div>
                            <h3 className="text-[#E6EDF3] font-bold text-lg">{title}</h3>
                            <p className="text-[#9FB0C3] text-sm">{description}</p>
                        </div>
                    </div>
                    <div className="flex items-center justify-between">
                        <span className="text-sky-400 text-sm font-medium">Start Building →</span>
                        <div className="w-2 h-2 bg-green-400 rounded-full"></div>
                    </div>
                </div>
            );
        };

        // Recent Model Card Component
        const RecentModelCard = ({ ticker, modelType, lastUpdated, status, navigate }) => {
            const handleClick = () => {
                const modelTypeLower = modelType.toLowerCase();
                if (modelTypeLower === 'merger') {
                    navigate(`/merger?acquirer=${ticker}`);
                } else {
                    navigate(`/${modelTypeLower}?ticker=${ticker}`);
                }
            };

            const getStatusColor = (status) => {
                switch (status) {
                    case 'completed': return 'bg-green-500';
                    case 'in_progress': return 'bg-yellow-500';
                    case 'error': return 'bg-red-500';
                    default: return 'bg-gray-500';
                }
            };

            return (
                <div 
                    onClick={handleClick}
                    className="bg-[#12161C] rounded-xl p-4 border border-[#1C2430] hover:border-sky-500/50 cursor-pointer transition-all duration-200 hover:shadow-lg hover:shadow-sky-500/10"
                >
                    <div className="flex items-center justify-between mb-3">
                        <div className="flex items-center space-x-3">
                            <div className="w-8 h-8 bg-sky-600 rounded-lg flex items-center justify-center">
                                <span className="text-white font-bold text-sm">{ticker[0]}</span>
                            </div>
                            <div>
                                <h4 className="text-[#E6EDF3] font-semibold">{ticker}</h4>
                                <p className="text-[#9FB0C3] text-sm">{modelType} Model</p>
                            </div>
                        </div>
                        <div className={`w-3 h-3 rounded-full ${getStatusColor(status)}`}></div>
                    </div>
                    <div className="flex items-center justify-between">
                        <span className="text-[#9FB0C3] text-xs">{lastUpdated}</span>
                        <span className="text-sky-400 text-xs font-medium">View →</span>
                    </div>
                </div>
            );
        };

        // Data Source Card Component
        const DataSourceCard = ({ name, description, status }) => {
            const getStatusColor = (status) => {
                switch (status) {
                    case 'active': return 'bg-green-500';
                    case 'inactive': return 'bg-red-500';
                    case 'warning': return 'bg-yellow-500';
                    default: return 'bg-gray-500';
                }
            };

            return (
                <div className="bg-[#1C2430] rounded-lg p-4 border border-[#2C3540]">
                    <div className="flex items-center justify-between mb-2">
                        <h4 className="text-[#E6EDF3] font-medium text-sm">{name}</h4>
                        <div className={`w-2 h-2 rounded-full ${getStatusColor(status)}`}></div>
                    </div>
                    <p className="text-[#9FB0C3] text-xs">{description}</p>
                </div>
            );
        };

        // Enhanced Sector Leaders Card with Sparklines
        const SectorLeadersCard = ({ sector, totalMktCap, leaders, isLoading, onCompanyAction }) => {
            const sectorSlug = sector.toLowerCase().replace(/\s+/g, '-');
            
            if (isLoading) {
                return (
                    <div className="bg-[#12161C] rounded-2xl p-6 border border-[#1C2430]" data-testid={`sector-card-${sectorSlug}`}>
                        <div className="animate-pulse">
                            <div className="h-6 bg-[#1C2430] rounded mb-4"></div>
                            <div className="space-y-3">
                                {[...Array(3)].map((_, i) => (
                                    <div key={i} className="flex items-center space-x-3">
                                        <div className="w-16 h-4 bg-[#1C2430] rounded"></div>
                                        <div className="flex-1 h-4 bg-[#1C2430] rounded"></div>
                                        <div className="w-12 h-4 bg-[#1C2430] rounded"></div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            }
            
            // Only show sectors that have actual data
            if (!leaders || leaders.length === 0) {
                return null;
            }
            
            return (
                <div className="bg-[#12161C] rounded-2xl p-6 border border-[#1C2430]" data-testid={`sector-card-${sectorSlug}`}>
                    <div className="flex items-center justify-between mb-4">
                        <h3 className="text-[#E6EDF3] font-bold text-xl">{sector}</h3>
                        <span className="text-[#9FB0C3] text-sm">
                            {totalMktCap ? formatMoneyCompact(totalMktCap) : 'N/A'}
                        </span>
                    </div>
                    
                    <div className="space-y-3">
                        {leaders.map((leader, index) => (
                            <div 
                                key={leader.ticker || index}

                    <div className="max-w-[1400px] mx-auto px-4 md:px-6 lg:px-8 py-8 space-y-8">

                                <ModelTypeCard

            );
        };

        // Main App with Router
        function App() {
            return (
                <HashRouter>
                    <Routes>
                        <Route exact path="/" component={DashboardPage} />
                        <Route path="/dcf" component={DCFPage} />
                        <Route path="/lbo" component={LBOPage} />
                        <Route path="/comps" component={CompsPage} />
                        <Route path="/merger" component={MergerPage} />
                    </Routes>
                </HashRouter>
            );
        }

        // Render with React 18 API
        try {
            const rootElement = document.getElementById('root');
            console.log('Root element:', rootElement);
            const root = ReactDOM.createRoot(rootElement);
            console.log('React root created:', root);
            root.render(<App />);
            console.log('App rendered successfully');
        } catch (error) {
            console.error('Render error:', error);
            document.getElementById('root').innerHTML = '<div style="color: white; padding: 20px; text-align: center;"><h1>Render Error</h1><p>' + error.message + '</p><pre>' + error.stack + '</pre></div>';
        }
        {% endraw %}
    </script>
