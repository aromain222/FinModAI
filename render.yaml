services:
  - type: web
    name: finmodai
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATA_MODE
        value: development
      - key: DATA_STALENESS_MAX_MIN
        value: 30
      - key: REQUIRE_MIN_FUND_YEARS
        value: 3